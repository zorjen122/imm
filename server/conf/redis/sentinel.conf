bind 127.0.0.1
protected-mode yes
port @PORT@

daemonize yes
pidfile @PID_FILE@
logfile @LOG_FILE@
dir @DATA_DIR@

requirepass root
sentinel monitor wimi-master 127.0.0.1 6380 2
sentinel auth-pass wimi-master root
sentinel down-after-milliseconds wimi-master 1000
sentinel failover-timeout wimi-master 10000
sentinel parallel-syncs wimi-master 1
