syntax = "proto3";

package file;

message FileInfo {
  string file_id = 1;
  string file_name = 2;
  string file_type = 3;
  int64 file_size = 4;
  bytes sha256 = 5;
}

message UploadRequest {
  FileInfo file = 1;
  int64 user_id = 2;
  int64 offset = 3;
  bytes data = 4;
  bool complete = 5;
}

message UploadResponse {
  int64 user_id = 1;
  TransferStatus status = 2;
  int64 next_offset = 3;
  string message = 4;
}

message DownloadRequest { FileInfo file = 1; int64 user_id = 2; int64 offset = 3; int64 limit = 4; }

message DownloadResponse {
  bytes data = 1;
  int64 next_offset = 2;
  bool complete = 3;
  TransferStatus status = 4;
  string message = 5;
}

enum TransferStatus {
  SUCCESS = 0;
  FAILED = 1;
  PARTIAL = 2;
  PENDING = 3;
}

service FileService {
  rpc Upload(UploadRequest) returns (UploadResponse) {}
  rpc Download(DownloadRequest) returns (DownloadResponse) {}
}
