    FileUploadChunkResponse file_upload_chunk_response = 53;       // 中间文件上传块的响应
    FileUploadCompleteRequest file_upload_complete_request = 54;   // 最后一个文件上传块
    FileUploadCompleteResponse file_upload_complete_response = 55; // 最后一个文件上传块的响应
    FileDownloadRequest file_download_request = 56;                // 文件分块下载请求
    FileDownloadResponse file_download_response = 57;              // 文件分块下载响应
    SendFileRequest send_file_request = 58;                         // 发送单聊文件请求
    SendGroupFileRequest send_group_file_request = 59;              // 发送群聊文件请求
    FileMessagePush file_message_push = 60;                         // 文件消息推送

    CreateGroupRequest create_group_request = 70;                    // 创建群请求
    CreateGroupResponse create_group_response = 71;                  // 创建群响应
