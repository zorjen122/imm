    PullGroupMembersResponse pull_group_members_response = 83;        // 拉取群资料响应
  }
}

// 客户端 TCP 帧中的顶层数据。TCP 头只负责分帧；请求、响应与推送的语义在这里明确表达。
message ClientEnvelope {
  oneof body {
    ClientRequest request = 1;
    ClientResponse response = 2;
    ClientPush push = 3;
  }
}

message ClientRequest {
  string request_id = 1; // 客户端生成，用于关联响应，不能为空
  Packet packet = 2;
  Operation operation = 3;
}

message ClientResponse {
  string request_id = 1; // 原样返回对应 ClientRequest.request_id
  Packet packet = 2;
  Operation operation = 3;
}

message ClientPush {
  int64 delivery_id = 1; // 用于客户端 ACK 和 Gateway 重传；不可靠通知可为 0
  Packet packet = 2;
  PushType type = 3;
}
