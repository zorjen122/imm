bind 127.0.0.1
protected-mode yes
port @PORT@

daemonize yes
pidfile @PID_FILE@
logfile @LOG_FILE@
dir @DATA_DIR@

requirepass root
sentinel monitor imm-master 127.0.0.1 6380 2
sentinel auth-pass imm-master root
sentinel down-after-milliseconds imm-master 1000
sentinel failover-timeout imm-master 10000
sentinel parallel-syncs imm-master 1
