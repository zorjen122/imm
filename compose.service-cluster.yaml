services:
  mysql:
    ports:
      - "127.0.0.1::3306"

  redis:
    ports:
      - "127.0.0.1::6379"

  state:
    configs:
      - source: cluster-state-config
        target: /etc/wimi/state.yaml

  message-2:
    image: wimi-server:local
    restart: unless-stopped
    command: [/opt/wimi/bin/message, --log_level, info]
    environment:
      WIMI_CONFIG: /etc/wimi/message-2.yaml
    configs:
      - source: cluster-message-2-config
        target: /etc/wimi/message-2.yaml
    depends_on:
      file:
        condition: service_started
      mysql:
        condition: service_healthy
      sentinel:
        condition: service_healthy
      state:
        condition: service_started

  gateway:
    depends_on:
      message-2:
        condition: service_started

  gateway-2:
    image: wimi-server:local
    restart: unless-stopped
    command: [/opt/wimi/bin/gateway, --log_level, info, --smp, "1", --memory, 256M, --overprovisioned, --reactor-backend, io_uring]
    environment:
      WIMI_CONFIG: /etc/wimi/gateway-2.yaml
    configs:
      - source: cluster-gateway-2-config
        target: /etc/wimi/gateway-2.yaml
    depends_on:
      message:
        condition: service_started
      message-2:
        condition: service_started
      mysql:
        condition: service_healthy
      sentinel:
        condition: service_healthy
      state:
        condition: service_started
    ports:
      - "8091:8091"

configs:
  cluster-state-config:
    file: ./conf/compose/cluster/state.yaml
  cluster-message-2-config:
    file: ./conf/compose/cluster/message-2.yaml
  cluster-gateway-2-config:
    file: ./conf/compose/cluster/gateway-2.yaml
