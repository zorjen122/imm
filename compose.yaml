name: imm

include:
  - ./infra.yaml

x-imm-service: &imm-service
  image: imm-server:local
  restart: unless-stopped

services:
  state:
    <<: *imm-service
    build:
      context: .
      dockerfile: server/Dockerfile
    command: [/opt/imm/bin/state, --log_level, info, --memory, 256M, --overprovisioned]
    environment:
      IMM_CONFIG: /etc/imm/services.yaml
      IMM_NODE: state
    configs:
      - source: services-config
        target: /etc/imm/services.yaml

  file:
    <<: *imm-service
    command: [/opt/imm/bin/file, --log_level, info, --memory, 256M, --overprovisioned]
    environment:
      IMM_CONFIG: /etc/imm/services.yaml
      IMM_NODE: file
    configs:
      - source: services-config
        target: /etc/imm/services.yaml
    volumes:
      - file-data:/var/lib/imm/files

  message:
    <<: *imm-service
    command: [/opt/imm/bin/message, --log_level, info, --memory, 256M, --overprovisioned]
    environment:
      IMM_CONFIG: /etc/imm/services.yaml
      IMM_NODE: message-1
    configs:
      - source: services-config
        target: /etc/imm/services.yaml
    depends_on:
      file:
        condition: service_started
      mysql:
        condition: service_healthy
      sentinel:
        condition: service_healthy
      state:
        condition: service_started

  gateway:
    <<: *imm-service
    command: [/opt/imm/bin/gateway, --log_level, info, --memory, 256M, --overprovisioned, --reactor-backend, io_uring]
    environment:
      IMM_CONFIG: /etc/imm/services.yaml
      IMM_NODE: gateway-1
    configs:
      - source: services-config
        target: /etc/imm/services.yaml
    depends_on:
      message:
        condition: service_started
      mysql:
        condition: service_healthy
      sentinel:
        condition: service_healthy
      state:
        condition: service_started
    ports:
      - "8090:8090"

  gate:
    <<: *imm-service
    command: [/opt/imm/bin/gate, --log_level, info, --memory, 256M, --overprovisioned, --reactor-backend, io_uring]
    environment:
      IMM_CONFIG: /etc/imm/services.yaml
      IMM_NODE: gate
    configs:
      - source: services-config
        target: /etc/imm/services.yaml
    depends_on:
      mysql:
        condition: service_healthy
      sentinel:
        condition: service_healthy
      state:
        condition: service_started
    ports:
      - "18080:18080"

configs:
  services-config:
    file: ./loopback/compose/services.yaml

volumes:
  file-data:
