name: wimi

include:
  - ./infra.yaml

x-wimi-service: &wimi-service
  image: wimi-server:local
  restart: unless-stopped

services:
  state:
    <<: *wimi-service
    build:
      context: .
      dockerfile: server/Dockerfile
      additional_contexts:
        seastar-source: ${WIMI_SEASTAR_SOURCE:-/home/zongjing/workspace/ref/network/seastar}
    command: [/opt/wimi/bin/state, --log_level, info]
    environment:
      WIMI_CONFIG: /etc/wimi/state.yaml
    configs:
      - source: state-config
        target: /etc/wimi/state.yaml

  file:
    <<: *wimi-service
    command: [/opt/wimi/bin/file, --log_level, info]
    environment:
      WIMI_CONFIG: /etc/wimi/file.yaml
    configs:
      - source: file-config
        target: /etc/wimi/file.yaml
    volumes:
      - file-data:/var/lib/wimi/files

  message:
    <<: *wimi-service
    command: [/opt/wimi/bin/message, /etc/wimi/message.yaml, --log_level, info]
    configs:
      - source: message-config
        target: /etc/wimi/message.yaml
    depends_on:
      file:
        condition: service_started
      mysql:
        condition: service_healthy
      sentinel:
        condition: service_healthy
      state:
        condition: service_started

  gateway:
    <<: *wimi-service
    command: [/opt/wimi/bin/gateway, --log_level, info, --smp, "1", --memory, 256M, --overprovisioned, --reactor-backend, io_uring]
    environment:
      WIMI_CONFIG: /etc/wimi/gateway.yaml
    configs:
      - source: gateway-config
        target: /etc/wimi/gateway.yaml
    depends_on:
      message:
        condition: service_started
      mysql:
        condition: service_healthy
      sentinel:
        condition: service_healthy
      state:
        condition: service_started
    ports:
      - "8090:8090"

  gate:
    <<: *wimi-service
    command: [/opt/wimi/bin/gate, --log_level, info, --smp, "1", --memory, 256M, --overprovisioned, --reactor-backend, io_uring]
    environment:
      WIMI_CONFIG: /etc/wimi/gate.yaml
    configs:
      - source: gate-config
        target: /etc/wimi/gate.yaml
    depends_on:
      mysql:
        condition: service_healthy
      sentinel:
        condition: service_healthy
      state:
        condition: service_started
    ports:
      - "18080:18080"

configs:
  state-config:
    file: ./conf/compose/state.yaml
  file-config:
    file: ./conf/compose/file.yaml
  message-config:
    file: ./conf/compose/message.yaml
  gateway-config:
    file: ./conf/compose/gateway.yaml
  gate-config:
    file: ./conf/compose/gate.yaml

volumes:
  file-data:
